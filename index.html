<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#17212b" />
    <meta name="description" content="Find and compare Telegram marketplaces." />
    <title>Explore</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M6 3v5m0 4v9M12 3v10m0 4v4M18 3v2m0 4v12"/><path d="M3 8h6v4H3zM9 13h6v4H9zM15 5h6v4h-6z"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9.4 3-.5 2.2-2 .9-2-.7-2.2 3.8 1.6 1.5v2.6l-1.6 1.5 2.2 3.8 2-.7 2 .9.5 2.2h4.4l.5-2.2 2-.9 2 .7 2.2-3.8-1.6-1.5v-2.6l1.6-1.5-2.2-3.8-2 .7-2-.9-.5-2.2Z"/><circle cx="11.6" cy="12" r="3"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
      <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24"><path d="M4 11v10h16V11M2 7h20v4H2zM12 7v14"/><path d="M12 7H7a2.5 2.5 0 1 1 2.4-3.2ZM12 7h5a2.5 2.5 0 1 0-2.4-3.2Z"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></symbol>
      <symbol id="i-message" viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/><path d="M8 8h8M8 12h5"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0L12 5.8l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.5a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    </svg>
    <main class="directory" aria-label="OTC directory">
      <header class="toolbar">
        <div class="search-field">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search OTCs" aria-label="Search OTCs" autocomplete="off" spellcheck="false" />
          <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" hidden><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
        <button id="filter-toggle" class="round-button" type="button" aria-label="Show filters" aria-expanded="false" aria-controls="filters"><svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg><span class="filter-dot" hidden></span></button>
        <button id="settings-toggle" class="round-button" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
      </header>
      <section class="settings" id="settings" aria-label="Settings" hidden>
        <div class="filter-row"><span class="filter-label">Theme</span><div class="segmented" role="group" aria-label="Theme"><button type="button" data-theme-choice="light" aria-pressed="false">Day</button><button type="button" data-theme-choice="dark" aria-pressed="false">Night</button><button type="button" data-theme-choice="device" aria-pressed="true">Device</button></div></div>
        <div class="filter-row"><span class="filter-label">Card size</span><div class="segmented" role="group" aria-label="Card size"><button type="button" data-density="compact" aria-pressed="false">Compact</button><button type="button" data-density="normal" aria-pressed="true">Normal</button><button type="button" data-density="large" aria-pressed="false">Large</button></div></div>
      </section>
      <section class="filters" id="filters" aria-label="Filter OTCs" hidden>
        <div class="filter-row"><span class="filter-label">Your OTCs</span><div class="segmented" role="group" aria-label="Your OTCs"><button type="button" data-liked="all" aria-pressed="true">All</button><button type="button" data-liked="liked" aria-pressed="false">Liked</button></div></div>
        <div class="filter-row"><span class="filter-label">Posting price</span><div class="segmented" role="group" aria-label="Posting price"><button type="button" data-price="all" aria-pressed="true">All</button><button type="button" data-price="free" aria-pressed="false">Free</button><button type="button" data-price="paid" aria-pressed="false">Paid</button></div></div>
        <div class="filter-row"><label class="filter-label" for="language">Chat language</label><select id="language"><option value="all">All languages</option><option value="multiple">Multiple languages</option></select></div>
        <div class="filter-row"><label class="filter-label" for="sort">Sort by</label><select id="sort"><option value="rank">Recommended</option><option value="likes">Most liked</option><option value="price">Lowest posting price</option><option value="members">Most members</option><option value="value">Highest admin gift value</option><option value="activity">Most messages / day</option></select></div>
        <button id="reset-filters" class="text-button" type="button">Reset filters</button>
      </section>
      <div class="list-heading"><h1>EXPLORE</h1><div class="list-tools"><span id="result-count"></span><a id="add-otc" class="add-otc" href="https://t.me/FindOTCAi?startgroup&amp;admin=manage_chat" target="_blank" rel="noopener noreferrer" aria-label="Add your OTC"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></a></div></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section class="cards" id="cards" aria-label="OTC results"></section>
      <div id="empty-state" class="empty-state" hidden><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><strong id="empty-title">No OTCs found</strong><p id="empty-description">Try another search or change your filters.</p><button id="empty-reset" class="text-button" type="button">Clear search &amp; filters</button></div>
      <noscript>Enable JavaScript to browse the directory.</noscript>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
